<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Depoimentos — Cedro Decor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect width=%2248%22 height=%2248%22 rx=%2211%22 fill=%22%233d2b1f%22/><g fill=%22%23b08d57%22><rect x=%229%22 y=%229%22 width=%2230%22 height=%2213%22 rx=%226%22/><rect x=%229%22 y=%2223%22 width=%2230%22 height=%2211%22 rx=%224%22/><rect x=%224%22 y=%2215%22 width=%227%22 height=%2219%22 rx=%223.5%22/><rect x=%2237%22 y=%2215%22 width=%227%22 height=%2219%22 rx=%223.5%22/></g></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="admin-logo"><span class="admin-logo-mark"><svg viewBox="0 0 48 48" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="9" y="9" width="30" height="13" rx="6"/><rect x="9" y="23" width="30" height="11" rx="4"/><rect x="4" y="15" width="7" height="19" rx="3.5"/><rect x="37" y="15" width="7" height="19" rx="3.5"/></svg></span>Cedro Decor</div>
      <nav class="admin-nav">
        <a href="painel.html">Painel</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="produtos.html">Produtos</a>
        <a href="depoimentos.html" class="active">Depoimentos</a>
        <a href="../index.html" target="_blank">Ver site</a>
      </nav>
      <div class="admin-sidebar-bottom">
        <a href="#" id="logout-link">Sair</a>
      </div>
    </aside>

    <main class="admin-main">
      <button class="nav-toggle-admin" id="nav-toggle-admin">☰ Menu</button>
      <div class="admin-topbar">
        <div>
          <h1>Depoimentos</h1>
          <p>Avaliações de clientes mostradas no site. Se chegar algum comentário falso ou indevido, é só excluir.</p>
        </div>
        <button class="btn btn-primary" id="btn-new-testimonial">+ Adicionar depoimento</button>
      </div>

      <div id="testimonials-admin-list"></div>
    </main>
  </div>

  <!-- Modal de formulário de depoimento -->
  <div class="modal-overlay" id="testimonial-form-modal">
    <div class="modal" style="grid-template-columns: 1fr; max-width: 560px;">
      <button class="modal-close" id="form-close-btn" aria-label="Fechar">✕</button>
      <div class="modal-body">
        <h3 id="form-title">Adicionar depoimento</h3>
        <form id="testimonial-form">
          <div class="form-row">
            <label class="form-label" for="t-name">Nome do cliente</label>
            <input class="form-input" type="text" id="t-name" placeholder="Ex: Maria Silva" required />
          </div>

          <div class="form-row form-grid-2">
            <div>
              <label class="form-label" for="t-role">Complemento (opcional)</label>
              <input class="form-input" type="text" id="t-role" placeholder="Ex: Cliente desde 2023" />
            </div>
            <div>
              <label class="form-label" for="t-rating">Nota</label>
              <select class="form-select" id="t-rating">
                <option value="5">5 de 5</option>
                <option value="4">4 de 5</option>
                <option value="3">3 de 5</option>
                <option value="2">2 de 5</option>
                <option value="1">1 de 5</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label" for="t-text">Depoimento</label>
            <textarea class="form-textarea" id="t-text" placeholder="O que o cliente disse sobre a loja..." required></textarea>
          </div>

          <div class="modal-actions" style="padding-top: 12px;">
            <button type="button" class="btn btn-outline btn-block" id="form-cancel-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary btn-block">Salvar depoimento</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/testimonials-data.js"></script>
  <script src="../js/testimonials-store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-shell.js"></script>
  <script src="js/depoimentos-admin.js"></script>
</body>
</html>

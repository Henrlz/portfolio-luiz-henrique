<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cedro Decor — Acesso administrativo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect width=%2248%22 height=%2248%22 rx=%2211%22 fill=%22%233d2b1f%22/><g fill=%22%23b08d57%22><rect x=%229%22 y=%229%22 width=%2230%22 height=%2213%22 rx=%226%22/><rect x=%229%22 y=%2223%22 width=%2230%22 height=%2211%22 rx=%224%22/><rect x=%224%22 y=%2215%22 width=%227%22 height=%2219%22 rx=%223.5%22/><rect x=%2237%22 y=%2215%22 width=%227%22 height=%2219%22 rx=%223.5%22/></g></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">
  <div class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="admin-logo"><span class="admin-logo-mark"><svg viewBox="0 0 48 48" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="9" y="9" width="30" height="13" rx="6"/><rect x="9" y="23" width="30" height="11" rx="4"/><rect x="4" y="15" width="7" height="19" rx="3.5"/><rect x="37" y="15" width="7" height="19" rx="3.5"/></svg></span>Cedro Decor</div>
      <p class="sub">Painel administrativo — restrito à equipe da loja</p>

      <div class="login-error" id="login-error">Usuário ou senha incorretos. Tente novamente.</div>

      <div class="form-row">
        <label class="form-label" for="username">Usuário</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="admin" autocomplete="username" required />
      </div>
      <div class="form-row">
        <label class="form-label" for="password">Senha</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="form-hint" style="text-align:center;margin-top:16px;">Esqueceu a senha? Fale com quem cuida do site da loja.</p>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (CedroDecorAuth.isLoggedIn()) window.location.href = 'painel.html';

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      if (CedroDecorAuth.login(user, pass)) {
        window.location.href = 'painel.html';
      } else {
        document.getElementById('login-error').classList.add('show');
      }
    });
  </script>
</body>
</html>

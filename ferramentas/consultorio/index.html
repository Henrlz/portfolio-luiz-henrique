<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultório | Agenda e prontuário (demo)</title>
  <meta name="description" content="Agenda semanal, prontuário e conta corrente por paciente para psicólogos, com modo discreto. Demonstração com dados fictícios.">
  <meta name="theme-color" content="#a8492a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a8492a'/%3E%3Cpath d='M9 22V10h14v12M9 15h14M14 10v12' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/consultorio.css">
  <script>
    try {
      var t = localStorage.getItem('consultorio:tema');
      if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.tema = 'escuro';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <nav class="trilho" id="trilho" aria-label="Seções"></nav>
    <main id="conteudo" tabindex="-1"></main>
  </div>
  <div class="veu" id="veu"></div>
  <aside class="gaveta" id="gaveta" aria-hidden="true"></aside>
  <dialog id="dlg"></dialog>
  <div class="recado" id="recado" role="status" aria-live="polite"></div>
  <div id="recibo" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

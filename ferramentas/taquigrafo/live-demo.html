<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live de demonstração · Taquígrafo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/demo.css">
<style>
  /* só o player, ocupando a janela: é o que o modo link coloca no lugar do YouTube */
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  .player { position: fixed; inset: 0; aspect-ratio: auto; border-radius: 0; }
  .escondido { display: none !important; }
</style>
</head>
<body>
<div class="player" id="movie_player">
  <video class="html5-main-video" id="video" playsinline muted></video>
  <div class="ytp-caption-window-container" id="legendas" aria-live="off">
    <div class="caption-window"><span class="captions-text" id="linhas"></span></div>
  </div>
  <div class="player__barra">
    <span class="ao-vivo" id="aoVivo">● AO VIVO</span>
    <span class="player__tempo" id="tempo">0:00</span>
    <button type="button" class="ytp-subtitles-button" id="botaoCC" aria-pressed="true" data-title-no-tooltip="Legendas" title="Legendas">CC</button>
  </div>
  <button type="button" class="player__comecar" id="comecar">
    <span class="player__play" aria-hidden="true">▶</span>
    Começar a live de demonstração
  </button>
</div>
<div class="escondido">
  <iframe id="chatframe" title="Chat"></iframe>
  <div class="velocidade"><button type="button" data-v="1" aria-checked="true">1×</button><button type="button" data-v="2">2×</button><button type="button" data-v="4">4×</button></div>
  <button type="button" id="recomecar">Recomeçar</button>
  <input type="checkbox" id="som" checked>
</div>
<audio id="fala" src="fala-demo.wav" preload="auto"></audio>
<script src="js/demo.js"></script>
<script>
  // ?v=2 acelera (para testes); a fala do final sai no alto-falante para entrar no áudio da aba
  const v = +(new URLSearchParams(location.search).get('v') || 1);
  if (v > 1) window.DemoLive.velocidade = v;
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contas a Receber | Borderô de títulos (demo)</title>
  <meta name="description" content="Emissão de contas a receber: monte o borderô de títulos, importe a planilha de receita, valide CNPJ e conta contábil e gere o arquivo de importação do ERP. Demonstração com dados fictícios.">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='3' fill='%2314213d'/%3E%3Cpath d='M11 7v18' stroke='%23e8ecf1' stroke-width='1.6' stroke-dasharray='2 2'/%3E%3Cpath d='M15 13h10M15 18h6' stroke='%23e8ecf1' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/receber.css">
  <script>
    try {
      var t = localStorage.getItem('receber:tema');
      if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.tema = 'escuro';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topo">
    <a class="marca" href="#bordero" aria-label="Contas a Receber, início">
      <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true">
        <rect x="1" y="3" width="38" height="24" rx="4" fill="currentColor"/>
        <path d="M13 3v24" stroke="var(--fundo)" stroke-width="1.6" stroke-dasharray="2.5 2.5"/>
        <circle cx="13" cy="3" r="2.6" fill="var(--fundo)"/><circle cx="13" cy="27" r="2.6" fill="var(--fundo)"/>
        <path d="M18 11h15M18 16h10M18 21h6" stroke="var(--fundo)" stroke-width="2"/>
      </svg>
      <span><strong>Contas a Receber</strong><small>Emissão de títulos e borderô</small></span>
    </a>
    <div class="emissora" id="emissora"></div>
    <button class="btn btn-mini" id="alternar-tema" type="button" aria-label="Alternar tema claro e escuro" title="Tema claro ou escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </header>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <main id="conteudo" tabindex="-1"></main>
  <dialog id="dlg-emitido" aria-label="Borderô emitido"></dialog>
  <div class="recado" id="recado" role="status" aria-live="polite"></div>
  <div id="impressao" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

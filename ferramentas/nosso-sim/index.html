<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nosso Sim | caderno do casamento (demo)</title>
  <meta name="description" content="Caderno a dois para planejar o casamento mês a mês: tarefas, convidados, orçamento, fornecedores e o roteiro do dia. Demonstração com dados fictícios.">
  <meta name="theme-color" content="#3e4f2c">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='7.5' fill='none' stroke='%233e4f2c' stroke-width='2.6'/%3E%3Ccircle cx='20' cy='16' r='7.5' fill='none' stroke='%23c08a1e' stroke-width='2.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/nosso-sim.css">
  <script>
    try {
      var t = localStorage.getItem('nossosim:tema');
      if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.tema = 'escuro';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="recado" id="recado" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

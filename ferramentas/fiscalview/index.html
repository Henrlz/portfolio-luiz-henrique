<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FiscalView | Apuração de vendas por canal (demo)</title>
  <meta name="description" content="Apuração fiscal de vendas, devoluções e serviços por canal, com conferência de auditoria e importação de livros fiscais. Demonstração com dados fictícios.">
  <meta name="theme-color" content="#0c5a50">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c201e'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h10' stroke='%23f3f0e8' stroke-width='2.2'/%3E%3Cpath d='M21 20l2 2 4-5' stroke='%236cc2b0' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/fiscalview.css">
  <script>
    try {
      var t = localStorage.getItem('fiscalview:tema');
      if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.tema = 'escuro';
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topo">
    <a class="marca" href="#apuracao" aria-label="FiscalView, início">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="4" fill="currentColor"/>
        <path d="M8 10h16M8 16h16M8 22h10" stroke="var(--papel)" stroke-width="2.2"/>
        <path d="M21 20l2 2 4-5" stroke="var(--acento-2)" stroke-width="2.2" fill="none"/>
      </svg>
      <span><strong>FiscalView</strong><small>Apuração de vendas por canal</small></span>
    </a>
    <div class="espaco"></div>
    <div class="campo-topo">
      <span>Competência</span>
      <div class="competencia" id="competencia">-</div>
    </div>
    <label class="campo-topo">
      <span>Empresa</span>
      <select id="filtro-empresa"></select>
    </label>
    <div class="acoes-topo" style="display:flex;gap:8px;align-self:flex-end">
      <button class="btn btn-icone" id="alternar-tema" type="button" aria-label="Alternar tema claro e escuro" title="Tema claro ou escuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
      <button class="btn btn-tinta" type="button" data-acao="abrir-importacao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        Importar livro
      </button>
    </div>
  </header>

  <nav class="abas" id="abas" aria-label="Seções"></nav>

  <main id="conteudo" tabindex="-1"></main>

  <div class="veu" id="veu"></div>
  <aside class="gaveta" id="gaveta" aria-hidden="true" aria-labelledby="gaveta-titulo"></aside>

  <dialog id="dlg-importar" aria-labelledby="dlg-titulo"></dialog>

  <div class="recado" id="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
